<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio dip — sell screen with Bakame caution</title>
<style>

body{margin:0}
a{color:#8edafb}a:hover{color:#c3e8f8}

html{background:#d9dde1}
#dc-root{width:390px;margin:0 auto}
@media (min-width:430px){html:not(.shot) body{padding:24px 0}html:not(.shot) #dc-root>div{border-radius:32px;box-shadow:0 20px 50px rgba(7,21,34,.25)}}</style>
</head>
<body>
<template id="dc-template"><div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #050b11; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; display: flex; flex-direction: column">

  <header style="padding: 22px 20px 8px; display: flex; align-items: center; gap: 12px">
    <a href="1-trigger.html" aria-label="Back to dashboard" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #293943; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 19px; font-weight: 650; letter-spacing: -0.04em">My portfolio</span>
  </header>

  <section style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 9px; font-weight: 760; letter-spacing: 0.12em; text-transform: uppercase; color: #62bde8">Current value</span>
    <span style="font-size: 50px; font-weight: 650; letter-spacing: -0.075em; font-variant-numeric: tabular-nums">€2,290.00</span>
    <span style="font-size: 14px; font-weight: 700; color: #ff7a82">−€210.00 (−8.4%) this month</span>
  </section>

  <figure style="margin: 16px 20px 0; padding: 16px; border-radius: 22px; border: 1px solid #243440; background: #0b1218">
    <svg width="318" height="140" viewBox="0 0 318 140" role="img" aria-label="Portfolio value rose for two months, then fell 8.4% over the last month, ending below the €2,500 invested">
      <line x1="0" y1="70" x2="318" y2="70" stroke="#3a4a55" stroke-width="1" stroke-dasharray="4 4"></line>
      <path d="M0 70 L30 66 L60 64 L90 58 L120 60 L150 50 L180 44 L200 40 L215 46 L235 62 L255 78 L275 94 L295 88 L318 92" fill="none" stroke="#4fc3f7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>
      <path d="M200 40 L215 46 L235 62 L255 78 L275 94 L295 88 L318 92" fill="none" stroke="#ef3340" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>
      <circle cx="314" cy="91" r="4" fill="#ef3340"></circle>
    </svg>
    <figcaption style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; font-weight: 650; color: #899da9"><span>Jul</span><span>Dashed: €2,500 invested</span><span>Today</span></figcaption>
  </figure>

  <section style="margin: 12px 20px 0; padding: 14px 16px; border-radius: 18px; border: 1px solid #243440; background: #0b1218; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 14px; font-weight: 650">[Fund name]</span>
      <span style="font-size: 12px; color: #899da9">Goal: The Expedition · 5 yrs · month 3</span>
    </div>
    <span style="font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 99px; border: 1px solid #293943; color: #a5b8c4">[N] units</span>
  </section>

  <sc-if value="{{keptMsg}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="margin: 12px 20px 0; padding: 14px; border-radius: 18px; border: 1px solid #2c825d; background: #102d22; color: #82e3bd; font-size: 14px; font-weight: 650; line-height: 1.4">Staying the course. Bakame will check in with you next week.</div>
  </sc-if>
  <sc-if value="{{coolMsg}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="margin: 12px 20px 0; padding: 14px; border-radius: 18px; border: 1px solid #654e28; background: #2b2315; color: #f2c777; font-size: 14px; font-weight: 650; line-height: 1.4">Reminder set for tomorrow. Nothing has been sold.</div>
  </sc-if>
  <sc-if value="{{soldMsg}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="margin: 12px 20px 0; padding: 14px; border-radius: 18px; border: 1px solid #293943; background: #0d171e; color: #e8f0f4; font-size: 14px; font-weight: 650; line-height: 1.4">Sell order sent to [Bank]. Proceeds arrive in your current account in [T+N] days.</div>
  </sc-if>

  <div style="flex-grow: 1"></div>

  <footer style="padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 51px; border-radius: 99px; border: 0; background: #FFFFFF; color: #071522; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer">Add money</button>
      <button type="button" onClick="{{tapSell}}" style="height: 51px; border-radius: 99px; border: 1px solid rgba(255, 255, 255, 0.5); background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer">Sell</button>
    </div>
    <a href="1-trigger.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 650; text-decoration: none">Restart the flow</a>
  </footer>

  <sc-if value="{{showCaution}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5, 11, 17, 0.7)"></div>
    <section role="dialog" aria-modal="true" aria-labelledby="st-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 92px 20px 22px; border-radius: 28px 28px 0 0; background: #FFFFFF; color: #0d1116; display: flex; flex-direction: column; gap: 12px">
      <img src="images/bakame-caution.png" alt="Bakame raising both palms in a calm stop gesture" style="position: absolute; top: -78px; left: 50%; width: 196px; height: 164px; margin-left: -98px; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.35))">
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center">
        <span style="font-size: 9px; font-weight: 760; letter-spacing: 0.13em; text-transform: uppercase; color: #c8202d">Bakame · Caution</span>
        <h2 id="st-title" style="margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.05em; line-height: 1">Hold on. Let's look<br><span style="color: #879099">at this together.</span></h2>
      </div>

      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
        <li style="padding: 12px 14px; border-radius: 16px; border: 1px solid #d8dde1; background: #f6f7f8; font-size: 13px; line-height: 1.4"><strong>You'd lock in a €210 loss.</strong> Today it's only on paper.</li>
        <li style="padding: 12px 14px; border-radius: 16px; border: 1px solid #d8dde1; background: #f6f7f8; font-size: 13px; line-height: 1.4"><strong>You're in month 3 of a 5-year plan.</strong> Short drops are normal along the way.</li>
        <li style="padding: 12px 14px; border-radius: 16px; border: 1px solid #d8dde1; background: #f6f7f8; font-size: 13px; line-height: 1.4"><strong>Markets can fall and recover on uncertain timelines.</strong> Past performance does not predict future results.</li>
      </ul>

      <button type="button" onClick="{{keep}}" style="height: 51px; border-radius: 99px; border: 0; background: #111111; color: #FFFFFF; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer">Stay invested</button>
      <button type="button" onClick="{{cool}}" style="height: 48px; border-radius: 99px; border: 1px solid #d8dde1; background: #FFFFFF; color: #0d1116; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer">Remind me in 24 hours</button>
      <button type="button" onClick="{{sell}}" style="min-height: 44px; border: 0; background: transparent; color: #5f6871; font-size: 14px; font-weight: 650; font-family: inherit; text-decoration: underline; cursor: pointer">Sell anyway</button>
    </section>
  </sc-if>
</div></template>
<div id="dc-root"></div>
<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { Object.assign(this.state, patch); dcRender(); }
  forceUpdate() { dcRender(); }
}
function dcLookup(scope, path) {
  path = path.trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  return path.split('.').reduce((v, k) => (v == null ? undefined : v[k]), scope);
}
const WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;
function dcInterp(str, scope) {
  return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = dcLookup(scope, p); return v == null ? '' : String(v); });
}
function dcProcess(node, scope, out) {
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(dcInterp(node.textContent, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-if') {
    const m = (node.getAttribute('value') || '').match(WHOLE);
    if (m && dcLookup(scope, m[1])) node.childNodes.forEach((c) => dcProcess(c, scope, out));
    return;
  }
  if (tag === 'sc-for') {
    const m = (node.getAttribute('list') || '').match(WHOLE);
    const as = node.getAttribute('as') || 'item';
    (m ? dcLookup(scope, m[1]) || [] : []).forEach((item, i) => {
      const s = Object.assign({}, scope, { [as]: item, $index: i });
      node.childNodes.forEach((c) => dcProcess(c, s, out));
    });
    return;
  }
  const el = node.namespaceURI === 'http://www.w3.org/1999/xhtml'
    ? document.createElement(node.localName)
    : document.createElementNS(node.namespaceURI, node.localName);
  for (const a of Array.from(node.attributes)) {
    if (a.name.startsWith('hint-')) continue;
    const m = a.value.match(WHOLE);
    if (a.name.startsWith('on') && m) {
      const fn = dcLookup(scope, m[1]);
      if (typeof fn === 'function') el.addEventListener(a.name.slice(2), fn);
      continue;
    }
    if ((a.name === 'checked' || a.name === 'disabled') && m) { el[a.name] = !!dcLookup(scope, m[1]); continue; }
    el.setAttribute(a.name, dcInterp(a.value, scope));
  }
  const kids = node.content ? node.content.childNodes : node.childNodes;
  kids.forEach((c) => dcProcess(c, scope, el));
  out.appendChild(el);
}
let dcInstance;
function dcRender() {
  const root = document.getElementById('dc-root');
  const frag = document.createDocumentFragment();
  const vals = dcInstance.renderVals();
  document.getElementById('dc-template').content.childNodes.forEach((c) => dcProcess(c, vals, frag));
  root.replaceChildren(frag);
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'view' };
  }
  renderVals() {
    const m = this.state.mode;
    return {
      showCaution: m === 'caution',
      keptMsg: m === 'kept',
      coolMsg: m === 'cool',
      soldMsg: m === 'sold',
      tapSell: () => this.setState({ mode: 'caution' }),
      keep: () => this.setState({ mode: 'kept' }),
      cool: () => this.setState({ mode: 'cool' }),
      sell: () => this.setState({ mode: 'sold' })
    };
  }
}
const dcProps = {};
dcInstance = new Component(dcProps);
const dcQuery = new URLSearchParams(location.search);
if (dcQuery.has('shot')) document.documentElement.classList.add('shot');
const dcStart = dcQuery.get('state');
if (dcStart) Object.assign(dcInstance.state, JSON.parse(dcStart));
dcRender();
</script>
</body>
</html>
