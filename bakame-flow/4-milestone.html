<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milestone — first 30 days invested</title>
<style>

body{margin:0}
a{color:#8edafb}a:hover{color:#c3e8f8}

html{background:#d9dde1}
#dc-root{width:390px;margin:0 auto}
@media (min-width:430px){html:not(.shot) body{padding:24px 0}html:not(.shot) #dc-root>div{border-radius:32px;box-shadow:0 20px 50px rgba(7,21,34,.25)}}</style>
</head>
<body>
<template id="dc-template"><div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #f4f5f6; color: #0d1116; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden">

  <div aria-hidden="true" style="padding: 28px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 22px; font-weight: 650; letter-spacing: -0.04em">Good morning, [Customer name]</div>
    <div style="height: 150px; border-radius: 22px; background: #FFFFFF; border: 1px solid #d8dde1"></div>
    <div style="height: 64px; border-radius: 16px; background: #FFFFFF; border: 1px solid #d8dde1"></div>
    <div style="height: 64px; border-radius: 16px; background: #FFFFFF; border: 1px solid #d8dde1"></div>
    <div style="height: 64px; border-radius: 16px; background: #FFFFFF; border: 1px solid #d8dde1"></div>
  </div>

  <sc-if value="{{showPush}}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{open}}" style="position: absolute; top: 14px; left: 12px; right: 12px; padding: 12px 14px; border-radius: 22px; border: 1px solid #d8dde1; background: rgba(255, 255, 255, 0.97); box-shadow: 0 14px 34px rgba(7, 21, 34, 0.2); display: flex; gap: 12px; align-items: center; text-align: left; font-family: inherit; color: #0d1116; cursor: pointer">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: #071522; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; flex-shrink: 0">
        <img src="images/bakame-celebrating.png" alt="" style="width: 44px; height: 40px; object-fit: contain; object-position: center bottom">
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="display: flex; justify-content: space-between; font-size: 11px; color: #5f6871"><span style="font-weight: 700; letter-spacing: 0.04em">[BANK] · IZERE</span><span>now</span></span>
        <span style="font-size: 14px; font-weight: 650">30 days invested. Bakame is proud of you.</span>
        <span style="font-size: 13px; color: #3c454d">Your €2,500 is now €2,521.30. Tap to see.</span>
      </span>
    </button>
  </sc-if>

  <sc-if value="{{showOverlay}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5, 11, 17, 0.62)"></div>
    <section role="dialog" aria-modal="true" aria-labelledby="ms-title" style="position: absolute; left: 14px; right: 14px; top: 96px; padding: 112px 20px 20px; border-radius: 30px; border: 1px solid #1b3548; background: radial-gradient(circle at 50% 0, rgba(79, 195, 247, 0.24), transparent 45%), #071522; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <img src="images/bakame-celebrating.png" alt="Bakame celebrating with both fists raised" style="position: absolute; top: -72px; left: 50%; width: 200px; height: 182px; margin-left: -100px; object-fit: contain; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.55))">
      <span style="font-size: 9px; font-weight: 760; letter-spacing: 0.13em; text-transform: uppercase; color: #f2c777">Milestone unlocked</span>
      <h1 id="ms-title" style="margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -0.055em; line-height: 0.95">30 days as<br><span style="color: #c3e8f8">an investor.</span></h1>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 38px; font-weight: 650; letter-spacing: -0.07em; font-variant-numeric: tabular-nums">€2,521.30</span>
        <span style="font-size: 13px; font-weight: 700; color: #82e3bd">+€21.30 since you started</span>
      </div>

      <div style="width: 100%; box-sizing: border-box; padding: 12px; border-radius: 18px; border: 1px solid #263742; background: #0d171e; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 9px; font-weight: 760; letter-spacing: 0.12em; text-transform: uppercase; color: #65c7ef; text-align: left">Weekly check-ins</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{weeks}}" as="w" hint-placeholder-count="4">
            <div style="{{w.style}}">{{w.label}}</div>
          </sc-for>
        </div>
      </div>

      <sc-if value="{{askHabit}}" hint-placeholder-val="{{ true }}">
        <div style="width: 100%; box-sizing: border-box; padding: 14px; border-radius: 18px; border: 1px solid #263742; background: #0d171e; display: flex; flex-direction: column; gap: 10px; text-align: left">
          <span style="font-size: 14px; font-weight: 650; line-height: 1.4; color: #e8f0f4">Keep the streak going: put €100 aside every payday?</span>
          <div style="display: flex; gap: 8px">
            <button type="button" onClick="{{accept}}" style="flex: 1; min-height: 44px; border-radius: 99px; border: 0; background: #8edafb; color: #06131c; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer">Set it up</button>
            <button type="button" onClick="{{decline}}" style="flex: 1; min-height: 44px; border-radius: 99px; border: 1px solid #385264; background: transparent; color: #c1d0da; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer">Maybe later</button>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{habitSet}}" hint-placeholder-val="{{ false }}">
        <div style="width: 100%; box-sizing: border-box; padding: 14px; border-radius: 18px; border: 1px solid #2c825d; background: #102d22; color: #82e3bd; font-size: 14px; font-weight: 650; text-align: left">Done. €100 moves on each payday. Change or stop it anytime.</div>
      </sc-if>

      <a href="5-stress-test.html" style="width: 100%; height: 51px; border-radius: 99px; background: #FFFFFF; color: #071522; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">View portfolio</a>
    </section>
  </sc-if>
</div></template>
<div id="dc-root"></div>
<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { Object.assign(this.state, patch); dcRender(); }
  forceUpdate() { dcRender(); }
}
function dcLookup(scope, path) {
  path = path.trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  return path.split('.').reduce((v, k) => (v == null ? undefined : v[k]), scope);
}
const WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;
function dcInterp(str, scope) {
  return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = dcLookup(scope, p); return v == null ? '' : String(v); });
}
function dcProcess(node, scope, out) {
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(dcInterp(node.textContent, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-if') {
    const m = (node.getAttribute('value') || '').match(WHOLE);
    if (m && dcLookup(scope, m[1])) node.childNodes.forEach((c) => dcProcess(c, scope, out));
    return;
  }
  if (tag === 'sc-for') {
    const m = (node.getAttribute('list') || '').match(WHOLE);
    const as = node.getAttribute('as') || 'item';
    (m ? dcLookup(scope, m[1]) || [] : []).forEach((item, i) => {
      const s = Object.assign({}, scope, { [as]: item, $index: i });
      node.childNodes.forEach((c) => dcProcess(c, s, out));
    });
    return;
  }
  const el = node.namespaceURI === 'http://www.w3.org/1999/xhtml'
    ? document.createElement(node.localName)
    : document.createElementNS(node.namespaceURI, node.localName);
  for (const a of Array.from(node.attributes)) {
    if (a.name.startsWith('hint-')) continue;
    const m = a.value.match(WHOLE);
    if (a.name.startsWith('on') && m) {
      const fn = dcLookup(scope, m[1]);
      if (typeof fn === 'function') el.addEventListener(a.name.slice(2), fn);
      continue;
    }
    if ((a.name === 'checked' || a.name === 'disabled') && m) { el[a.name] = !!dcLookup(scope, m[1]); continue; }
    el.setAttribute(a.name, dcInterp(a.value, scope));
  }
  const kids = node.content ? node.content.childNodes : node.childNodes;
  kids.forEach((c) => dcProcess(c, scope, el));
  out.appendChild(el);
}
let dcInstance;
function dcRender() {
  const root = document.getElementById('dc-root');
  const frag = document.createDocumentFragment();
  const vals = dcInstance.renderVals();
  document.getElementById('dc-template').content.childNodes.forEach((c) => dcProcess(c, vals, frag));
  root.replaceChildren(frag);
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { opened: false, habit: 'ask' };
  }
  renderVals() {
    const done = 'min-height: 36px; border-radius: 99px; background: #8edafb; color: #06131c; font-size: 12px; font-weight: 760; display: flex; align-items: center; justify-content: center';
    return {
      showPush: !this.state.opened,
      showOverlay: this.state.opened,
      open: () => this.setState({ opened: true }),
      askHabit: this.state.habit === 'ask',
      habitSet: this.state.habit === 'set',
      accept: () => this.setState({ habit: 'set' }),
      decline: () => this.setState({ habit: 'later' }),
      weeks: [
        { label: 'Wk 1', style: done },
        { label: 'Wk 2', style: done },
        { label: 'Wk 3', style: done },
        { label: 'Wk 4', style: done }
      ]
    };
  }
}
const dcProps = {};
dcInstance = new Component(dcProps);
const dcQuery = new URLSearchParams(location.search);
if (dcQuery.has('shot')) document.documentElement.classList.add('shot');
const dcStart = dcQuery.get('state');
if (dcStart) Object.assign(dcInstance.state, JSON.parse(dcStart));
dcRender();
</script>
</body>
</html>
